name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go-sdk MCP requires Go 1.25+
        go-version: ["1.25.x", "stable"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Check gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -trimpath -o rstar ./cmd/rstar

      - name: Smoke
        run: |
          set -euo pipefail
          ./rstar version
          ./rstar doctor >/dev/null || true
          ./rstar help >/dev/null
          ./rstar help --agent >/dev/null
          ./rstar commands --json >/dev/null
          ./rstar skill show >/dev/null
          ./rstar upgrade --help >/dev/null

  # Single required check for branch protection (stable across matrix).
  ci:
    name: CI
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require matrix green
        run: |
          set -euo pipefail
          test "${{ needs.test.result }}" = "success"
